name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  acceptance:
    uses: ./.github/workflows/ci.yaml
    with:
      require_license: true

  publish-testpypi:
    needs: acceptance
    if: github.event_name == 'release' && needs.acceptance.result == 'success'
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi:
    needs: [acceptance, publish-testpypi]
    if: github.event_name == 'release' && needs.acceptance.result == 'success' && needs.publish-testpypi.result == 'success' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
