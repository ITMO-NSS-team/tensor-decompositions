[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdecomp"
version = "0.2.4"
description = "Library for tensor and matrix decompositions applications"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "BSD License"}
authors = [
    {name = "Leon Strelkov", email = "strelllleo@mail.ru"}
]
keywords = ["tensor decompositions", "matrix decompositions", "randomized algorithms"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.26.4,<2",
    "tensorly>=0.9.0,<0.10",
    "torch>=2.2,<2.6",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.16.2,<2.17"]
distributed = ["torch>=2.4,<2.6"]
visualization = ["matplotlib>=3.7.5,<4"]
test = ["pytest>=7.2,<9", "build>=1,<2", "twine>=5,<7"]
experiments = ["matplotlib>=3.7.5,<4", "psutil>=5.9,<8", "pandas>=2.1,<3"]
training = ["transformers>=4.46,<5", "accelerate>=1,<2", "datasets>=3,<5", "evaluate>=0.4,<1", "mlflow>=2.17,<4"]
profiling = ["nvidia-ml-py>=12,<14"]

[project.urls]
Homepage = "https://github.com/ITMO-NSS-team/tensor-decompositions"

# If you want to include both packages, use:
# packages = ["tdecomp", "experiments"]

# Alternative: use find to automatically discover packages
[tool.setuptools.packages.find]
include = ["tdecomp*"]  # Include tdecomp and all subpackages
exclude = ["tests*", "experiments*"]  # Exclude test/experiment packages

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
